name: Run maven tests

on:
    pull_request:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: 'maven'

            - name: Set executable persimission for Maven
              run: chmod +x mvnw

            - name: Start mongodb for test
              run: docker compose -f compose.yaml up -d mongodb

            - name: Exectute tests with maven
              env:
                    SPRING_PROFILES_ACTIVE: dev
                    MONGODB_USER: root
                    MONGODB_PASSWORD: secretpassword
                    MONGODB_DATABASE: mydatabase
                    MONGODB_HOST: localhost
                    MONGODB_PORT: 27017
              run: ./mvnw --batch-mode clean verify -T4 -Dmaven.test.failure.ignore=false