spring.config.import=optional:file:.env.properties
chat.base-url=http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
indexing.base-url=http://${INDEXING_SERVICE_HOST}:${INDEXING_SERVICE_PORT}
data.base-url=http://${DATA_SERVICE_HOST}:${DATA_SERVICE_PORT}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?authSource=admin
CHAT_SERVICE_HOST=localhost
CHAT_SERVICE_PORT=5001
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
INDEXING_SERVICE_HOST=localhost
INDEXING_SERVICE_PORT=5000
DATA_SERVICE_HOST=localhost
DATA_SERVICE_PORT=5002
POSTGRES_HOST=postgres

# OAuth2 Client Registration
spring.security.oauth2.client.registration.azure.client-id=4900e1fa-a323-4e8e-8b72-32103ff8f6a6
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.redirect-uri=https://10.0.1.236/login/oauth2/code/azure
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.client-name=ituki

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/a0fa6491-9cf8-4d90-b250-034371313c03/v2.0